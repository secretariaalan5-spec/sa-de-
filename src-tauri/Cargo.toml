[package]
name = "saude-plus-desktop"
version = "1.0.0"
description = "Saúde+ - Gestão de Escalas (Aplicativo Desktop)"
authors = ["Saúde+"]
edition = "2021"
default-run = "saude-plus-desktop"

[[bin]]
name = "saude-plus-desktop"
path = "src/main.rs"

[[bin]]
name = "SaudePlus-Instalador"
path = "src/installer.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winrt-notification = "0.5"
windows = { version = "0.24.0", features = ["Data_Xml_Dom", "UI_Notifications"] }
xml-rs = "0.8.4"
